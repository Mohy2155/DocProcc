<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Glowing Filters -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Dark Base Tile (Optional dark mode background) -->
  <rect width="128" height="128" rx="28" fill="#0b1120" />

  <!-- Document Outline with Dogear -->
  <path
    d="M 38 24 
       H 70 
       L 90 44 
       V 102 
       A 6 6 0 0 1 84 108 
       H 38 
       A 6 6 0 0 1 32 102 
       V 30 
       A 6 6 0 0 1 38 24 Z"
    stroke="url(#cyanGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#0f172a"
    fill-opacity="0.6"
    filter="url(#glow)"
  />

  <!-- Dogear Fold Corner -->
  <path
    d="M 70 24 V 44 H 90"
    stroke="url(#cyanGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Cloud Contour -->
  <path
    d="M 52 48 
       A 8 8 0 0 1 67 44 
       A 13 13 0 0 1 89 50 
       A 8 8 0 0 1 87 64 
       H 52 
       A 8 8 0 0 1 52 48 Z"
    stroke="url(#cyanGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Dynamic Lifting Arrow -->
  <path
    d="M 64 96 
       V 60 
       M 48 74 
       L 64 58 
       L 80 74"
    stroke="url(#arrowGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
